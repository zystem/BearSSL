version: 2
updates:
  # the dependencies of the project: the actions of the workflows and the Go module of the interop test program
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/test/interop_go"
    schedule:
      interval: weekly
