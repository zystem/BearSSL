name: Fuzz

# the TLS 1.3 handshake parsers (client and server engine): a few minutes once a week, and when asked, for as long as asked; not on every push
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "per target, in seconds"
        default: "300"
        required: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Address space layout of the runner
        run: |
          bits=$(sudo sysctl -n vm.mmap_rnd_bits)
          if [ "$bits" -gt 28 ]; then sudo sysctl -w vm.mmap_rnd_bits=28; fi
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
      - name: Build the library, the seeds and the fuzz targets
        run: |
          make -j"$(nproc)"
          sh test/fuzz/mkseeds.sh
          CC=clang sh test/fuzz/build.sh
      - name: Run (the two targets side by side; a crash, a timeout or an out-of-memory fails the job)
        run: sh test/fuzz/run.sh "$SECONDS_PER_TARGET" 2 build-fuzz-run
      - name: Findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: build-fuzz-run/artifacts-*
          retention-days: 30
