name: Release

# a tag v* makes a release: the tests again, then the source archive, the SBOM, the VEX document, keyless signatures, build provenance and the GitHub release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # the release
      id-token: write        # the keyless signature and the attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Source archive
        run: |
          mkdir -p dist
          ver="${TAG#v}"
          git archive --format=tar.gz --prefix="bearssl-tls13-$ver/" -o "dist/bearssl-tls13-$ver.tar.gz" "$TAG"
          (cd dist && sha256sum "bearssl-tls13-$ver.tar.gz" > "bearssl-tls13-$ver.tar.gz.sha256")
          cp vex/bearssl-tls13.openvex.json dist/bearssl-tls13.openvex.json

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/bearssl-tls13.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the files
        run: |
          for f in dist/bearssl-tls13-*.tar.gz dist/bearssl-tls13.spdx.json dist/bearssl-tls13.openvex.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Provenance of the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/bearssl-tls13-*.tar.gz

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
