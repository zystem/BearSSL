name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # the library, the tool and the tests with each compiler; warnings are errors
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, warnings are errors
        env:
          CC: ${{ matrix.cc }}
        run: make -j"$(nproc)" CC="$CC" CFLAGS="-W -Wall -Werror -Os -fPIC"
      - name: Unit tests
        run: |
          build/testcrypto all
          build/testx509
      - name: Documents (the commands they show and what they print)
        run: sh test/docs_check.sh
      - name: TLS 1.3 client against OpenSSL
        run: sh test/interop_openssl13.sh
      - name: Coding standard of the files this fork added
        run: sh test/style_check.sh

  # other machines of GitHub: aarch64 (native), macOS on Apple silicon, x86 32 bit,
  # and a big-endian 64 bit machine (s390x, run in an emulator, so only the
  # tests of the TLS 1.3 code, the hashes, HKDF and the ciphers it uses)
  portability:
    name: portability (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aarch64, os: ubuntu-24.04-arm, cc: gcc, native: 1 }
          - { name: macos-arm64, os: macos-latest, cc: clang, native: 1 }
          - { name: x86-32bit, os: ubuntu-24.04, cc: "gcc -m32", native: 1, packages: gcc-multilib }
          - { name: s390x-big-endian, os: ubuntu-24.04, cc: s390x-linux-gnu-gcc, native: 0, packages: "gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Build, warnings are errors
        env:
          CC: ${{ matrix.cc }}
        run: make -j4 CC="$CC" LD="$CC" CFLAGS="-W -Wall -Werror -Os" build/libbearssl.a build/brssl build/testcrypto build/testx509
      - name: Unit tests (this machine)
        if: matrix.native == 1
        run: |
          build/testcrypto all
          build/testx509
      - name: Unit tests (emulator)
        if: matrix.native == 0
        run: |
          qemu-s390x -L /usr/s390x-linux-gnu build/testcrypto \
            SHA256 SHA384 SHA512 HMAC HKDF TLS13_KS TLS13_REC TLS13_HS \
            TLS13_REPLAY TLS13_HRR TLS13_LOOPBACK TLS13_SESSION TLS13_KEYUPDATE \
            ChaCha20_ct Poly1305_ctmul GHASH_ctmul AES_ct64 GCM EC_p256_m31 \
            EC_prime_i31 ECDSA_i31 RSA_i31
          qemu-s390x -L /usr/s390x-linux-gnu build/testx509

  # the TLS 1.3 server against scripts of tlsfuzzer (pinned by commit);
  # it needs the network for tlsfuzzer, tlslite-ng and the python package ecdsa
  tlsfuzzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make -j"$(nproc)"
      - name: tlsfuzzer scripts that must pass
        run: |
          sudo apt-get -qq install -y python3-venv
          sh test/tlsfuzzer/run.sh "$RUNNER_TEMP/tlsfuzzer"

  # line coverage of src/ by the tests; fails below 80%
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the tests with gcov and add up the lines of src/
        run: MIN=80 sh test/coverage.sh

  # the same unit tests with AddressSanitizer and UndefinedBehaviorSanitizer
  # (the alignment check is off: BearSSL does some unaligned reads on purpose)
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Address space layout of the runner (old libasan crashes at start above 28 bits)
        run: |
          bits=$(sudo sysctl -n vm.mmap_rnd_bits)
          echo "vm.mmap_rnd_bits=$bits"
          if [ "$bits" -gt 28 ]; then sudo sysctl -w vm.mmap_rnd_bits=28; fi
      - name: Build
        run: |
          make -j"$(nproc)" CC=gcc \
            CFLAGS="-W -Wall -g -O1 -fPIC -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=undefined" \
            LDFLAGS="-fsanitize=address,undefined" LDDLLFLAGS="-shared -fsanitize=address,undefined"
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          build/testcrypto all
          build/testx509

  # the other implementations: GnuTLS and Go as peers (46 cases, both roles; a missing peer or a wrong number of cases fails)
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Peers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnutls-bin
      - run: make -j"$(nproc)"
      - name: Interoperability with OpenSSL, GnuTLS and Go
        run: REQUIRE="openssl gnutls go" EXPECT=46 sh test/interop_server13.sh

  # the committed handshake code must be what the T0 sources give
  t0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel
      - name: Regenerate and compare
        run: |
          make T0
          git diff --exit-code -- src
